name: Collect yesterday news

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run collect
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: collect yesterday official digest"
          file_pattern: data/digests/*.json
